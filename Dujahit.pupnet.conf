########################################################################
# PupNet Deploy config for Dujahit. Build Linux packages from Linux/WSL:
#   pupnet Dujahit.pupnet.conf --kind appimage --runtime linux-x64
# Other kinds: deb, rpm, flatpak, zip (and setup for a Windows installer).
# If pupnet rejects a field, your installed version renamed it: run
#   pupnet --new conf
# to emit a template matched to your version, then copy these values in.
########################################################################

# App identity
AppBaseName = Dujahit
AppFriendlyName = Dujahit
AppId = com.dujahit.app
AppVersionRelease = 0.8.0[1]
AppShortSummary = A desktop D&D 5e toolkit with a multiplayer battlemap.
AppLicenseId = CC-BY-NC-4.0
AppLicenseFile = LICENSE.txt

# Publisher (fill these in)
PublisherName = Regian Landstrom
PublisherLinkName = Dujahit
PublisherLinkUrl =
PublisherEmail =

# Desktop integration
StartCommand = dujahit
PrimeCategory = Game
IconFiles = Assets/DujahitLogoBig.png

# The .NET build pupnet runs for you. Self-contained so no runtime needed on the machine.
DotnetProjectPath = Dujahit.csproj
DotnetPublishArgs = -c Release --self-contained true -p:PublishReadyToRun=true

# Where the finished packages land
OutputDirectory = dist
